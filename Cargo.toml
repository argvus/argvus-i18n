[workspace]
resolver = "2"
members = [
  "crates/core",
  "crates/main",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.95"
authors = ["ARGVUS"]
repository = "https://github.com/argvus/argvus-i18n"
homepage = "https://github.com/argvus/argvus-i18n"
description = "Shared internationalization infrastructure for the ARGVUS desktop"

[workspace.dependencies]
argvus-i18n-core = { version = "0.1.0", path = "crates/core" }
serde_json = "1"

[profile.release]
lto = true
strip = true

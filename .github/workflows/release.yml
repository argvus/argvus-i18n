name: Arch Linux Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package:
    name: Build and publish Arch Linux Package
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install packaging tools
        run: |
          pacman -Syu --noconfirm --needed cargo git gnupg namcap pacman-contrib sudo

      - name: Prepare build user
        run: |
          useradd --create-home --shell /bin/bash builder
          printf 'builder ALL=(ALL) NOPASSWD: ALL\n' >/etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Prepare PKGBUILD version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+)*([._+-][A-Za-z0-9]+)*$ ]]; then
            echo "Unsupported version tag: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

          if grep -qE '^url=""|^url=$' "packaging/arch/ci/PKGBUILD"; then
            echo "::error::url is not set in packaging/arch/ci/PKGBUILD (required to fetch the tag source archive)."
            exit 1
          fi

          sed -i "s/^pkgver=.*/pkgver=${version}/" "packaging/arch/ci/PKGBUILD"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Validate repository
        shell: bash
        run: |
          set -euo pipefail
          make validate

      - name: Build package
        shell: bash
        run: |
          set -euo pipefail

          sudo -u builder env GITHUB_WORKSPACE="$GITHUB_WORKSPACE" bash -lc 'cd "$GITHUB_WORKSPACE/packaging/arch/ci" && updpkgsums'

          sudo -u builder env GITHUB_WORKSPACE="$GITHUB_WORKSPACE" bash -lc 'cd "$GITHUB_WORKSPACE/packaging/arch/ci" && makepkg --nodeps --noconfirm --needed --cleanbuild --clean --check'

          pkg_files="$(find "packaging/arch/ci" -maxdepth 1 -type f -name 'argvus-*.pkg.tar.zst' -print | sort)"
          if [[ -z "$pkg_files" ]]; then
            echo "Package files were not created." >&2
            exit 1
          fi

          {
            echo "pkg_files<<EOF_PKG_LIST"
            printf '%s\n' "$pkg_files"
            echo "EOF_PKG_LIST"
          } >> "$GITHUB_ENV"

      - name: Lint package with namcap
        shell: bash
        run: |
          while IFS= read -r pkg_file; do
            sudo -u builder namcap "$pkg_file"
          done <<< "$pkg_files"

      - name: Sign package
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail

          [ -n "${GPG_PRIVATE_KEY:-}" ] || { echo "::error::GPG_PRIVATE_KEY secret is not set"; exit 1; }

          export GNUPGHOME
          GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"

          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          GPG_KEY_ID="$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^sec:/ { print $5; exit }')"
          [ -n "$GPG_KEY_ID" ] || { echo "::error::No secret GPG key was imported"; exit 1; }

          while IFS= read -r pkg_file; do
            [ -n "$pkg_file" ] || continue
            rm -f "${pkg_file}.sig"
            if [ -n "${GPG_PASSPHRASE:-}" ]; then
              gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --local-user "$GPG_KEY_ID" --detach-sign "$pkg_file"
            else
              gpg --batch --yes --pinentry-mode loopback --local-user "$GPG_KEY_ID" --detach-sign "$pkg_file"
            fi
          done <<< "$pkg_files"

      - name: Verify package signature
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          export GNUPGHOME
          GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import

          while IFS= read -r pkg_file; do
            [ -n "$pkg_file" ] || continue
            gpg --batch --verify "${pkg_file}.sig" "$pkg_file"
          done <<< "$pkg_files"

      - name: Upload temporary package artifact
        uses: actions/upload-artifact@v7
        with:
          name: argvus-i18n-packages
          path: |
            packaging/arch/ci/argvus-*.pkg.tar.zst
            packaging/arch/ci/argvus-*.pkg.tar.zst.sig
          if-no-files-found: error
          retention-days: 1

      - name: Checkout packages repository
        uses: actions/checkout@v7
        with:
          repository: argvus/packages
          path: packages-repo
          token: ${{ secrets.PACKAGES_REPO_TOKEN }}

      - name: Publish package to argvus/packages
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail

          [ -n "${GPG_PRIVATE_KEY:-}" ] || { echo "::error::GPG_PRIVATE_KEY secret is not set"; exit 1; }

          export GNUPGHOME
          GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          GPG_KEY_ID="$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^sec:/ { print $5; exit }')"
          [ -n "$GPG_KEY_ID" ] || { echo "::error::No secret GPG key was imported"; exit 1; }

          gpg_sign() {
            local target="$1"
            rm -f "${target}.sig"
            if [ -n "${GPG_PASSPHRASE:-}" ]; then
              gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --local-user "$GPG_KEY_ID" --detach-sign "$target"
            else
              gpg --batch --yes --pinentry-mode loopback  --local-user "$GPG_KEY_ID" --detach-sign "$target"
            fi
          }

          repo_dir="$GITHUB_WORKSPACE/packages-repo/public/arch/x86_64"
          mkdir -p "$repo_dir"
          while IFS= read -r pkg_file; do
            [ -n "$pkg_file" ] || continue
            pkg_name="$(basename "$pkg_file")"
            cp "$GITHUB_WORKSPACE/${pkg_file}" "$repo_dir/${pkg_name}"
            cp "$GITHUB_WORKSPACE/${pkg_file}.sig" "$repo_dir/${pkg_name}.sig"
          done <<< "$pkg_files"

          cd "$repo_dir"
          while IFS= read -r pkg_file; do
            [ -n "$pkg_file" ] || continue
            repo-add -R argvus.db.tar.gz "$(basename "$pkg_file")"
          done <<< "$pkg_files"
          gpg_sign argvus.db.tar.gz
          gpg_sign argvus.files.tar.gz
          gpg_sign argvus.db
          gpg_sign argvus.files

          cd "$GITHUB_WORKSPACE/packages-repo"
          git config --global --add safe.directory "$PWD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/arch/x86_64

          if git diff --cached --quiet -- public/arch/x86_64; then
            echo "No package repository changes to publish."
            exit 0
          fi

          git commit -m "Publish package ${{ steps.version.outputs.version }}"
          git push

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            packaging/arch/ci/argvus-*.pkg.tar.zst
            packaging/arch/ci/argvus-*.pkg.tar.zst.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
